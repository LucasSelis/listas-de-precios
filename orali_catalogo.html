<style>
  :root {
    --bg: #f5f2ee;
    --surface: #ffffff;
    --accent: #c8412a;
    --accent2: #e8a020;
    --text: #1a1410;
    --muted: #7a6e65;
    --border: #e0d8d0;
    --tag-bg: #f0ebe4;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--text);
    color: white;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-logo {
    width: 44px;
    height: 44px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', cursive;
    font-size: 20px;
    color: white;
    letter-spacing: 1px;
  }

  .brand-name {
    font-family: 'Bebas Neue', cursive;
    font-size: 28px;
    letter-spacing: 3px;
    color: white;
  }

  .brand-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: -4px;
  }

  .header-meta {
    text-align: right;
  }

  .header-date {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .header-count {
    font-size: 13px;
    color: var(--accent2);
    font-weight: 600;
    margin-top: 2px;
  }

  /* TOOLBAR */
  .toolbar {
    padding: 12px 24px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    background: rgba(255,255,255,0.04);
  }

  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.4;
  }

  .search-input {
    width: 100%;
    padding: 10px 12px 10px 38px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input::placeholder { color: rgba(255,255,255,0.3); }
  .search-input:focus { border-color: var(--accent); }

  .filter-select {
    padding: 10px 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .filter-select:focus { border-color: var(--accent); }
  .filter-select option { background: #1a1410; color: white; }

  .sort-btn {
    padding: 10px 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: rgba(255,255,255,0.7);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .sort-btn:hover, .sort-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* MAIN */
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .stat-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-pill strong {
    color: var(--text);
    font-weight: 600;
  }

  .stat-pill .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* CATEGORIES */
  .category-section {
    margin-bottom: 32px;
  }

  .category-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
  }

  .category-icon {
    font-size: 20px;
  }

  .category-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--text);
  }

  .category-badge {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    margin-left: auto;
  }

  /* PRODUCT GRID */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }

  .product-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    transition: all 0.2s;
    cursor: default;
  }

  .product-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow);
    transform: translateY(-1px);
  }

  .product-card.hidden { display: none; }

  .product-info { flex: 1; min-width: 0; }

  .product-code {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    font-weight: 500;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .product-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.35;
    word-break: break-word;
  }

  .product-price-wrap {
    text-align: right;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .product-currency {
    font-size: 10px;
    color: var(--muted);
    display: block;
    margin-bottom: 2px;
  }

  .product-price {
    font-family: 'Bebas Neue', cursive;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 1px;
    line-height: 1;
  }

  /* EMPTY */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    display: none;
  }

  .empty-state.visible { display: block; }

  .empty-state svg {
    opacity: 0.2;
    margin-bottom: 16px;
  }

  .empty-state h3 {
    font-family: 'Bebas Neue', cursive;
    font-size: 24px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    color: var(--text);
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }

  /* HIGHLIGHT */
  .hl { background: #fff3cd; border-radius: 2px; padding: 0 2px; }

  /* MOBILE */
  @media (max-width: 600px) {
    .header-top { padding: 12px 16px; }
    .toolbar { padding: 10px 16px; gap: 8px; }
    main { padding: 16px 12px 60px; }
    .product-grid { grid-template-columns: 1fr; }
    .brand-name { font-size: 22px; }
  }
</style>
</head>

      p.code.toLowerCase().includes(term);
    const matchCat = !catFilter || p.cat === catFilter;
    return matchSearch && matchCat;
  });

  if (sortAsc) {
    filtered.sort((a,b) => a.price - b.price);
  } else {
    filtered.sort((a,b) => b.price - a.price);
  }

  if (filtered.length === 0) {
    empty.classList.add('visible');
    countEl.textContent = '0 productos';
    return;
  }

  empty.classList.remove('visible');
  countEl.textContent = filtered.length + ' producto' + (filtered.length !== 1 ? 's' : '');

  // Group by category (respecting filter)
  const groups = {};
  filtered.forEach(p => {
    if (!groups[p.cat]) groups[p.cat] = [];
    groups[p.cat].push(p);
  });

  Object.keys(groups).forEach(cat => {
    const info = CATEGORIES[cat];
    const section = document.createElement('div');
    section.className = 'category-section';

    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `
      <span class="category-icon">${info.icon}</span>
      <span class="category-title">${info.label}</span>
      <span class="category-badge">${groups[cat].length} items</span>
    `;
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'product-grid';

    groups[cat].forEach(p => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="product-info">
          <div class="product-code">#${p.code}</div>
          <div class="product-name">${highlight(p.name, currentSearch)}</div>
        </div>
        <div class="product-price-wrap">
          <span class="product-currency">ARS $</span>
          <span class="product-price">${fmt(p.price)}</span>
        </div>
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

function toggleSort() {
  sortAsc = !sortAsc;
  document.getElementById('sortLabel').textContent = sortAsc ? 'Menor precio' : 'Mayor precio';
  document.getElementById('sortBtn').classList.toggle('active', !sortAsc);
  render();
}

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value;
  render();
});

document.getElementById('categoryFilter').addEventListener('change', e => {
  currentCat = e.target.value;
  render();
});

render();
</script>
</body>
</html>
